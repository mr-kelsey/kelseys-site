services:
  app:
    build: .
    image: mrs-kelsey-app:latest
    container_name: mrs-kelsey-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app-data:/app/data
    networks:
      - shared-web
    expose:
      - "8080"

networks:
  shared-web:
    external: true

volumes:
  app-data:
