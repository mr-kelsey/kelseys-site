[project]
name = "kelseys-root"
version = "0.1.0"
description = "kelseys.site — recipe book and family calendar"
requires-python = ">=3.10"
dependencies = [
    "fastlite",
    "python-fasthtml",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["has-calendar", ".venv"]
